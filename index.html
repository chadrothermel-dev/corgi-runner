<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corgi Endless Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="450"></canvas>
    
    <div id="ui-overlay">
      <div id="hud">
        <div id="score-display">Score: 0</div>
        <div id="high-score-display">High Score: 0</div>
      </div>

      <!-- Start Overlay -->
      <div id="start-screen" class="overlay">
        <h1>Corgi Endless Runner</h1>
        <p>Controls: [Space] / [Up Arrow] to Jump, [Down Arrow] to Duck, [P] to Pause</p>
        <button id="start-btn">Start Game</button>
      </div>

      <!-- Pause Overlay -->
      <div id="pause-screen" class="overlay hidden">
        <h2>Game Paused</h2>
        <button id="resume-btn">Resume Game</button>
      </div>

      <!-- Game Over Overlay -->
      <div id="game-over-screen" class="overlay hidden">
        <h2>Game Over</h2>
        <p>Score: <span id="final-score">0</span></p>
        <p>High Score: <span id="game-over-high-score">0</span></p>
        <button id="restart-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
